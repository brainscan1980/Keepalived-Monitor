services:
  keepalived-monitor:
    build: .
    container_name: keepalived-monitor
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - ./config:/app/config:ro
      - ./ssh:/root/.ssh:ro
      - ./data:/app/data
    environment:
      - TZ=Europe/Berlin
      - CONFIG_FILE=/app/config/config.yml
      - ADMIN_USERNAME=${ADMIN_USERNAME:?ADMIN_USERNAME muss in .env gesetzt sein}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD muss in .env gesetzt sein}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY muss in .env gesetzt sein}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - MAIL_ENABLED=${MAIL_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_TO=${MAIL_TO:-}
