<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="/static/manifest.json"><link rel="icon" href="/static/favicon.ico"><link rel="stylesheet" href="/static/app.css"><title>Einstellungen · Keepalived Monitor</title></head><body><div class="app-shell"><aside class="sidebar"><div class="sidebar-top"><div class="sidebar-title"><span class="brand-full">Keepalived<br><span>Monitor</span></span><span class="brand-short">KM</span></div><button class="sidebar-collapse" id="sidebarCollapse" type="button">‹</button></div><nav><a class="nav-link" href="/"><span class="nav-icon">⌂</span><span class="nav-text">Übersicht</span></a><div class="nav-label">Nodes</div>{% for n in nodes %}<a class="nav-link" href="/node/{{ n.name }}"><span class="nav-icon">●</span><span class="nav-text">{{ n.name }}</span></a>{% endfor %}<div class="nav-label">System</div><a class="nav-link active" href="/settings"><span class="nav-icon">⚙</span><span class="nav-text">Einstellungen</span></a></nav><form method="post" action="/logout" class="logout-form"><button class="logout-link" type="submit"><span class="nav-icon">↪</span><span class="nav-text">Abmelden</span></button></form></aside><button class="mobile-menu" id="mobileMenu" type="button">☰</button><div class="sidebar-overlay" id="sidebarOverlay"></div><main><header><div class="header-brand"><h1>Einstellungen</h1><p>Benachrichtigungen und SMTP</p></div><div></div><div class="theme-switch"><button data-theme="light" title="Heller Modus">☀</button><button data-theme="auto" title="Automatisch">◐</button><button data-theme="dark" title="Dunkler Modus">☾</button></div></header><form id="settingsForm"><section><h2>Benachrichtigungen</h2><div class="card settings-card"><label class="switch-row"><span><b>E-Mail-Benachrichtigungen</b><small>Master-Schalter für den Mailversand</small></span><input id="mail_enabled" type="checkbox"></label><label class="switch-row"><span><b>Node DOWN</b><small>Alarm senden, wenn ein Node mehrfach nicht erreichbar ist</small></span><input id="node_down" type="checkbox"></label><label class="switch-row"><span><b>Node wieder ONLINE</b><small>Recovery-Mail nach einem gemeldeten Ausfall</small></span><input id="recovery_mail" type="checkbox"></label><label class="field"><span>Fehlversuche bis zum Alarm</span><input id="failures_before_alert" type="number" min="1" max="20" required></label></div></section><section><h2>SMTP</h2><div class="card settings-card form-grid"><label class="field"><span>SMTP-Server</span><input id="smtp_host" autocomplete="off" required></label><label class="field"><span>Port</span><input id="smtp_port" type="number" min="1" max="65535" required></label><label class="field"><span>Verschlüsselung</span><select id="smtp_security"><option value="starttls">STARTTLS</option><option value="ssl">SSL/TLS</option><option value="none">Keine</option></select></label><label class="field"><span>Benutzername</span><input id="smtp_username" autocomplete="username"></label><label class="field"><span>Passwort</span><input id="smtp_password" type="password" autocomplete="new-password" placeholder="Gespeichertes Passwort beibehalten"></label><label class="field"><span>Absender</span><input id="mail_from" type="email" required></label><label class="field wide"><span>Empfänger</span><input id="mail_to" placeholder="mail@example.de, zweite@example.de" required></label></div></section><section><h2>Status</h2><div class="card"><div id="settingsStatus" class="settings-summary">Lade…</div><div class="control-buttons"><button type="button" id="testBtn">✉ Testmail senden</button><button type="submit" class="primary-btn">✓ Einstellungen speichern</button></div><div id="settingsResult" class="action-result"></div></div></section></form></main></div><script>window.CSRF_TOKEN={{ csrf|tojson }};</script><script src="/static/settings.js"></script></body></html>
