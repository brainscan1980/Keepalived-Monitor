<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="/static/manifest.json"><link rel="icon" href="/static/favicon.ico"><link rel="stylesheet" href="/static/app.css"><title>Keepalived Monitor</title></head><body><div class="app-shell"><aside class="sidebar"><div class="sidebar-title">Keepalived<br><span>Monitor</span></div><nav><a class="nav-link active" href="/">⌂ Übersicht</a><div class="nav-label">Nodes</div>{% for n in nodes %}<a class="nav-link" href="/node/{{ n.name }}">● {{ n.name }}</a>{% endfor %}</nav><form method="post" action="/logout" class="logout-form"><button class="logout-link" type="submit">↪ Abmelden</button></form></aside><main><header><div class="header-brand"><h1>Keepalived Monitor</h1><p>VRRP Cluster Dashboard</p></div><div id="cluster" class="pill header-cluster">Lade…</div><div class="theme-switch" role="group" aria-label="Farbschema"><button type="button" data-theme="light" title="Heller Modus">☀</button><button type="button" data-theme="auto" title="Automatisch">◐</button><button type="button" data-theme="dark" title="Dunkler Modus">☾</button></div></header><section><h2>Nodes</h2><div id="nodes" class="grid"></div></section><section><h2>VRRP Instanzen</h2><div id="vrrp" class="cards"></div></section><section><h2>Failover-Historie</h2><div id="history" class="history"></div></section><footer><span id="updated">–</span></footer></main></div><script>window.CSRF_TOKEN={{ csrf|tojson }};</script><script src="/static/app.js"></script></body></html>
