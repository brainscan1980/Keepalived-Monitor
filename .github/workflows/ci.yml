name: Go CI

on:
  push:
    branches:
      - go-rewrite
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go test, vet and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify module files
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: Run unit tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build binary
        run: go build -trimpath -ldflags="-s -w" -o /tmp/keepalived-monitor ./cmd/keepalived-monitor

      - name: Build Go Docker image
        run: docker build -f Dockerfile.go -t keepalived-monitor:go-ci .
